name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $m = Select-String -Path envutil.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"'
          if (-not $m) { throw "APP_VERSION not found in envutil.py" }
          $ver = $m.Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$ver") {
            throw "Tag $tag does not match APP_VERSION $ver (expected v$ver)"
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Setup.exe
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Point latest.json at the GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/installer/FormDD-Setup-*.exe |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $setup) { throw "FormDD-Setup-*.exe not found" }
          python scripts/write_release_meta.py $setup.FullName `
            --url-base "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: formdd-installer
          if-no-files-found: error
          path: |
            dist/installer/FormDD-Setup-*.exe
            dist/installer/SHA256SUMS.txt
            dist/installer/latest.json

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/installer/FormDD-Setup-*.exe |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $setup) { throw "FormDD-Setup-*.exe not found" }
          $sums = "dist/installer/SHA256SUMS.txt"
          if (-not (Test-Path $sums)) { throw "SHA256SUMS.txt not found" }
          $feed = "dist/installer/latest.json"
          if (-not (Test-Path $feed)) { throw "latest.json not found" }
          gh release create "${{ github.ref_name }}" `
            $setup.FullName `
            $sums `
            $feed `
            --title "FormDD ${{ github.ref_name }}" `
            --generate-notes

      - name: Publish the update feed to the site
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout -B master origin/master
          Copy-Item dist/installer/latest.json website/releases/latest.json -Force
          git add website/releases/latest.json
          $changed = git status --porcelain website/releases/latest.json
          if (-not $changed) { Write-Host "latest.json unchanged"; exit 0 }
          git commit -m "Publish latest.json for ${{ github.ref_name }}"
          git push origin master
